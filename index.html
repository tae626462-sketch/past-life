<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ชาติที่แล้วคุณเป็นอะไร?</title>
<meta property="og:title" content="ชาติที่แล้วคุณเป็นอะไร? 🔮">
<meta property="og:description" content="ใส่ชื่อ + วันเกิด รู้ทันที แม่นจนขนลุก">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1a0b2e;--bg2:#3b1466;--gold:#ffd166;--pink:#ff6fb5;--txt:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sarabun,sans-serif;color:var(--txt);min-height:100vh;
background:radial-gradient(circle at 30% 10%,var(--bg2),var(--bg1) 70%);
display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:420px;text-align:center}
h1{font-family:Mitr;font-size:30px;color:var(--gold);margin:10px 0 4px}
.sub{opacity:.8;margin-bottom:24px}
.box{background:rgba(255,255,255,.08);border-radius:20px;padding:22px;backdrop-filter:blur(6px)}
input{width:100%;padding:14px;border-radius:12px;border:none;font-size:17px;margin-bottom:12px;font-family:Sarabun}
button{width:100%;padding:15px;border:none;border-radius:14px;font-family:Mitr;font-size:18px;cursor:pointer;
background:linear-gradient(90deg,var(--pink),var(--gold));color:#2a0a3a;font-weight:600;margin-top:6px}
button.alt{background:rgba(255,255,255,.15);color:#fff}
.orb{font-size:80px;margin:20px 0;display:inline-block}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#res{display:none}
#cv{display:none}
#img{width:100%;display:block;-webkit-touch-callout:default;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);margin-bottom:14px}
.row{display:flex;gap:8px}.row button{flex:1}
.tip{font-size:14px;opacity:.75;margin:-4px 0 12px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9;align-items:center;justify-content:center;padding:20px}
#modal .mb{background:#2a1050;border-radius:20px;padding:22px;max-width:380px;width:100%}
#modal img{width:100%;border-radius:12px;margin:12px 0}
#modal p{line-height:1.6}
.foot{opacity:.5;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div id="form">
    <div class="orb">🔮</div>
    <h1>ชาติที่แล้วคุณเป็นอะไร?</h1>
    <p class="sub">ดวงจิตจะเผยความจริง… แม่นจนขนลุก</p>
    <div class="box">
      <input id="name" placeholder="ชื่อเล่นของคุณ" maxlength="20">
      <input id="bd" type="date">
      <button onclick="go()">เปิดดวงจิต ✨</button>
    </div>
  </div>
  <div id="load" style="display:none"><div class="orb spin">🔮</div><p id="lt">กำลังย้อนเวลา...</p></div>
  <div id="res">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <img id="img" alt="ผลชาติที่แล้ว">
    <p class="tip">📌 กดค้างที่รูป เพื่อบันทึกรูปได้ทันที</p>
    <div class="row"><button onclick="save()">💾 เซฟรูป</button><button onclick="share()">📤 แชร์</button></div>
    <button class="alt" onclick="again()">🔁 ลองชื่อเพื่อน</button>
  </div>
  <div id="modal" onclick="if(event.target===this)this.style.display='none'"><div class="mb">
  <p id="mt"></p><img id="mimg" alt=""><button onclick="$('modal').style.display='none'">เข้าใจแล้ว</button></div></div>
  <p class="foot">เพื่อความบันเทิงเท่านั้น 😆</p>
</div>

const DEATH=["สำลักข้าวเหนียวมะม่วง","หัวเราะจนลืมหายใจ","ตกเรือตอนจีบสาว","กินเยอะเกินไปในงานบุญ","ถูกแมวข่วนแล้วตกใจ","นอนหลับยาวไม่ตื่น","ลื่นเปลือกกล้วยตอนรีบไปกินข้าว","หัวเราะมุกตัวเองจนตกเก้าอี้","นอนรอแฟนตอบไลน์จนหลับยาว","กินส้มตำปูปลาร้าเผ็ดเกินพิกัด","ถูกห่านไล่จิกรอบวัด","เดินชนเสาเพราะมองคนหล่อ","แย่งขนมกับลิงแล้วแพ้","ตกต้นมะม่วงตอนแอบเก็บของคนอื่น","ร้องคาราโอเกะเสียงสูงเกินไป","ขี่ควายแล้วควายเบรกกะทันหัน","อดนอนดูละครหลังข่าว","ช็อกตอนเห็นราคาทอง","กินบุฟเฟ่ต์ไม่ยอมหยุด","แพ้เกมเป่ายิ้งฉุบแล้วเครียด","เต้นหมอลำจนหลังเคล็ด","ตามจีบคนเดิมสิบปีไม่สำเร็จ","โดนแม่ตีเพราะกลับบ้านดึก","สะดุดหมาวัดที่นอนขวางทาง","ลืมหายใจตอนเห็นบิลค่าไฟ","กินทุเรียนกับเหล้าพร้อมกัน","ตกเรือตอนเซลฟี่","โดนมดแดงรุมตอนแอบงีบ","อิจฉาเพื่อนจนตัวเขียว","ปีนกำแพงวังไปหาแฟน","หลงทางในตลาดนัดสามวันสามคืน","ขำจนกล้ามท้องแข็ง","กินข้าวเหนียวไม่ดื่มน้ำ","วิ่งหนีเจ้าหนี้ตกคลอง","ชนะหวยแล้วดีใจเกินไป","รอคิวร้านดังนานเกินไป","เถียงกับยายแล้วแพ้","ถูกไก่ชนจิกตอนไปเชียร์","นั่งสมาธิจนลืมลุก","ดมพริกแห้งตอนคั่ว","ฝึกวิชาเหาะแล้วลืมวิธีลง","กินหมูกระทะคนเดียวสามถาด","ตกใจเสียงจิ้งจกทัก","แอบกินขนมเซ่นไหว้","โดนผึ้งต่อยตอนขโมยน้ำผึ้ง","เขินจนหัวใจวาย","นอนตากแดดจนกลายเป็นข้าวเกรียบ","เล่นซ่อนหาแล้วไม่มีใครหาเจอ","ดำน้ำหาสร้อยที่ทำหล่น","จามแรงจนตกระเบียง","สู้กับห่านเรื่องขนมปัง","ถูกช้างเหยียบตอนขอหวย","ร้องไห้ดูละครจนขาดน้ำ","กินลูกชิ้นทอดร้อนๆ ทั้งลูก","ปั่นจักรยานไม่ดูทางตกบ่อปลา","โกหกแม่แล้วโดนจับได้"];
const $=id=>document.getElementById(id);
function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0}
let R;
function go(){
  const n=$('name').value.trim(),b=$('bd').value;
  if(!n){alert('ใส่ชื่อก่อนนะ');return}
  const h=hash(n.toLowerCase()+'|'+b);
  R={n,l:LIVES[h%LIVES.length],d:DEATH[(h>>>5)%DEATH.length],y:1350+(h>>>9)%400,p:70+(h>>>13)%30};
  $('form').style.display='none';$('load').style.display='block';
  const t=["กำลังย้อนเวลา...","เปิดบันทึกกรรม...","ดวงจิตกำลังตอบ..."];let i=0;
  const iv=setInterval(()=>{$('lt').textContent=t[++i%3]},700);
  const fl=Promise.all(['600 52px Mitr','46px Sarabun'].map(f=>document.fonts.load(f,'ชาติ'))).catch(()=>{});
  setTimeout(async()=>{await fl;clearInterval(iv);$('load').style.display='none';draw();$('img').src=$('cv').toDataURL('image/png');$('res').style.display='block';window.scrollTo(0,0)},2200);
}
function ct(c,t,x,y){c.textAlign='left';const w=c.measureText(t).width;c.fillText(t,x-w/2,y)}
function wrap(c,t,x,y,w,lh){let line='';for(const ch of t){if(c.measureText(line+ch).width>w){ct(c,line,x,y);line=ch;y+=lh}else line+=ch}ct(c,line,x,y)}
function draw(){
  const c=$('cv').getContext('2d'),W=1080,H=1350;
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#3b1466');g.addColorStop(1,'#1a0b2e');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<80;i++){c.fillStyle='rgba(255,255,255,'+Math.random()*.6+')';c.beginPath();c.arc(Math.random()*W,Math.random()*H,Math.random()*3,0,7);c.fill()}
  c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle='#ffd166';{let f=52;do{c.font='600 '+f+'px Mitr';f-=2}while(c.measureText('ชาติที่แล้วของ "'+R.n+'"').width>980&&f>28)}
  ct(c,'ชาติที่แล้วของ "'+R.n+'"',W/2,150);
  c.font='260px serif';ct(c,R.l[0],W/2,480);
  c.fillStyle='#fff';let fs=96;do{c.font='600 '+fs+'px Mitr';fs-=4}while(c.measureText(R.l[1]).width>1000&&fs>40);ct(c,R.l[1],W/2,640);
  c.fillStyle='#ffd166';c.font='44px Sarabun';ct(c,'มีชีวิตอยู่ราว พ.ศ. '+(R.y+543),W/2,720);
  c.fillStyle='#fff';c.font='46px Sarabun';wrap(c,R.l[2],W/2,830,880,64);
  c.fillStyle='#ff6fb5';c.font='42px Sarabun';wrap(c,'สาเหตุที่จากไป: '+R.d+' 💀',W/2,1000,960,56);
  c.fillStyle='#ffd166';c.font='600 58px Mitr';ct(c,'ความแม่น '+R.p+'%',W/2,1120);
  c.fillStyle='rgba(255,255,255,.6)';c.font='36px Sarabun';ct(c,'มาดูชาติที่แล้วของคุณ 👉 '+location.host,W/2,1270);
}
function blob(){return new Promise(r=>$('cv').toBlob(r,'image/png'))}
const UA=navigator.userAgent;
const INAPP=/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|TikTok|musical_ly/i.test(UA);
const IOS=/iPhone|iPad|iPod/i.test(UA);
function tipBox(msg){$('mt').innerHTML=msg;$('mimg').src=$('img').src;$('modal').style.display='flex'}
async function fileObj(){return new File([await blob()],'past-life.png',{type:'image/png'})}
async function save(){
  if(INAPP||IOS){tipBox('📲 <b>กดค้างที่รูปด้านล่าง</b> แล้วเลือก <b>"บันทึกรูปภาพ"</b>');return}
  try{
    const f=await fileObj();
    if(/Android/i.test(UA)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download='ชาติที่แล้ว.png';document.body.appendChild(a);a.click();a.remove();
  }catch(e){tipBox('📲 <b>กดค้างที่รูปด้านล่าง</b> แล้วเลือก <b>"บันทึกรูปภาพ"</b>')}
}
async function share(){
  const txt='ชาติที่แล้วฉันเป็น "'+R.l[1]+'" '+R.l[0]+' 😱 มาลองของคุณ 👉 '+location.href;
  try{
    const f=await fileObj();
    if(!INAPP&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.clipboard.writeText(txt)}catch(e){}
      await navigator.share({files:[f],text:txt});return}
  }catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt)}catch(e){}
  tipBox(INAPP
    ?'📲 แอปนี้แชร์รูปตรงไม่ได้<br>1) <b>กดค้างที่รูป → บันทึกรูปภาพ</b><br>2) โพสต์รูปลงเฟส/LINE ได้เลย<br>✅ คัดลอกข้อความ+ลิงก์ให้แล้ว วางในโพสต์ได้เลย<br><small>หรือกด ⋯ มุมขวาบน → "เปิดในเบราว์เซอร์" เพื่อแชร์ตรง</small>'
    :'📲 <b>กดค้างที่รูป → บันทึกรูปภาพ</b> แล้วโพสต์ได้เลย<br>✅ คัดลอกข้อความ+ลิงก์ให้แล้ว');
}
function again(){$('res').style.display='none';$('form').style.display='block';$('name').value='';$('name').focus()}
